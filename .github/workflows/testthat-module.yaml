## Example caller for the testthat-module reusable workflow.
## Replace fireSense_spreadFit with the module name (which must match the repository name).

name: testthat-module

on:
  pull_request:
    branches: [main, master, development]
  push:
    branches: [main, master, development]
    paths:
      - .github/workflows/testthat-module.yaml
      - fireSense_spreadFit.R
      - R/**
      - tests/**
  workflow_dispatch:

jobs:
  testthat-module:
    ## No permissions block: unlike render-module-rmd, this workflow writes nothing
    ## back to the repository, so the default `contents: read` it declares for
    ## itself is all it needs.
    uses: PredictiveEcology/actions/.github/workflows/testthat-module.yaml@main
    with:
      ## a PR with a `Depends-on:` line installs that unmerged PR as its post-merge version and waits until its checks are green
      depends-on-virtual-bump: true
      depends-on-gate: true
      module: fireSense_spreadFit
